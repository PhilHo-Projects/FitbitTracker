<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Sleep Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/sleep-lens.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23b9dc8c' d='M21 16a10 10 0 0 1-13-13 10 10 0 1 0 13 13Z'/></svg>"
    />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-intro" aria-labelledby="loginHeading">
        <span class="brand-mark brand-mark-large" aria-hidden="true">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25.8 20.4A12 12 0 0 1 11.6 6.2 11.5 11.5 0 1 0 25.8 20.4Z" fill="currentColor"/><circle cx="24" cy="8" r="2" fill="currentColor"/></svg>
        </span>
        <h1 id="loginHeading">Sleep Tracker</h1>
        <p>
          Understand your nights, follow your sleep trends, and explore what changes alongside them.
        </p>
        <a class="login-demo-link" href="/demo">View public demo <span aria-hidden="true">↗</span></a>
      </section>

      <section class="login-card">
        <div>
          <h2>Private sign in</h2>
        </div>

        <form id="loginForm" class="login-form">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            autofocus
          />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="loginError" class="form-error" role="alert" hidden></p>
          <button id="loginButton" class="primary-button primary-button-wide" type="submit">
            <span id="loginSpinner" class="button-spinner" hidden aria-hidden="true"></span>
            <span id="loginLabel">Open Sleep Tracker</span>
          </button>
        </form>
      </section>
    </main>

    <script type="module" src="/login.js"></script>
  </body>
</html>
